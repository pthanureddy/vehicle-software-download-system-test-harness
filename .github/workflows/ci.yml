name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Validate software-download manifest
        run: vehicle-swdl validate-manifest --manifest examples/manifest.json
      - name: Execute SWDL system test plan
        run: vehicle-swdl run --vehicle examples/vehicle.json --manifest examples/manifest.json --plan examples/system_test_plan.json --output-dir artifacts/ci-system-tests
