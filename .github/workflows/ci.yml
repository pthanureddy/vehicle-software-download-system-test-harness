name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Validate software-download manifest
        run: vehicle-swdl validate-manifest --manifest examples/manifest.json
      - name: Execute SWDL system test plan
        run: vehicle-swdl run --vehicle examples/vehicle.json --manifest examples/manifest.json --plan examples/system_test_plan.json --output-dir artifacts/ci-system-tests
      - name: Validate calibration contract
        run: vehicle-swdl validate-calibration --manifest examples/manifest.json --contract examples/calibration_contract.json --calibration examples/calibration.json
      - name: Build and verify software and calibration bundle
        run: |
          vehicle-swdl build-release --manifest examples/manifest.json --contract examples/calibration_contract.json --calibration examples/calibration.json --output artifacts/ci-release/software-calibration.zip --report artifacts/ci-release/report.json
          vehicle-swdl verify-release --bundle artifacts/ci-release/software-calibration.zip

  deliver-artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Build validated delivery bundle
        run: |
          vehicle-swdl build-release --manifest examples/manifest.json --contract examples/calibration_contract.json --calibration examples/calibration.json --output artifacts/ci-release/software-calibration.zip --report artifacts/ci-release/report.json
          vehicle-swdl verify-release --bundle artifacts/ci-release/software-calibration.zip
      - uses: actions/upload-artifact@v7
        with:
          name: software-calibration-delivery
          path: |
            dist/*.whl
            artifacts/ci-release/software-calibration.zip
            artifacts/ci-release/report.json
          if-no-files-found: error
